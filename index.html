<style>
:root{
  --bg:#111412; --bg2:#161a17; --surface:#1c211d; --line:#2e352f;
  --green:#2c5a2a; --green-ink:#9fd19a;
  --gold:#d8b778; --gold2:#e9cf9a; --cream:#f2eadb; --muted:#a8a698; --muted2:#7d7d72; --red:#e0866f;
  --radius:18px; --ease:cubic-bezier(.2,.7,.2,1);
  --head:"Marcellus",Georgia,serif; --body:"DM Sans",system-ui,-apple-system,sans-serif; --brand:"Lilita One","Marcellus",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden;min-height:100vh;
  background-image:radial-gradient(1100px 620px at 50% -12%,rgba(44,90,42,.32),transparent 62%),radial-gradient(800px 500px at 110% 40%,rgba(216,183,120,.05),transparent 60%)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

/* Header */
.top{position:sticky;top:0;z-index:40;background:rgba(17,20,18,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.top.scrolled{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:34px;height:auto}
.brand b{font-family:var(--brand);font-weight:400;font-size:23px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--gold);font-weight:700;margin-top:3px}
.lang{margin-left:auto;display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.lang button{min-width:44px;height:34px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#1b1a14}

/* Ornament & headings */
.orn{display:flex;justify-content:center;color:var(--gold);margin-bottom:14px}
.orn svg{width:190px;height:16px}
.eyebrow{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
.h2{font-family:var(--head);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.1;text-align:center}
.lead{color:var(--muted);text-align:center;max-width:520px;margin:10px auto 0}
section{padding:60px 0}

/* Hero */
.hero{text-align:center;padding:56px 0 40px}
.hero-logo{width:clamp(170px,26vw,240px);height:auto;margin:0 auto 26px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
.hero h1{font-family:var(--head);font-weight:400;font-size:clamp(34px,7vw,70px);line-height:1.05;max-width:900px;margin-inline:auto}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:#d4cdbc;font-size:clamp(16px,2.2vw,19px);margin:18px auto 28px;max-width:460px}
.cta{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;background:var(--gold);color:#1b1a14;font-weight:700;text-decoration:none}
.cta:hover{background:var(--gold2);}
.cta svg{width:18px;height:18px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.chip-info{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(28,33,29,.7);border:1px solid var(--line);font-size:13.5px;color:#d4cdbc}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green-ink);box-shadow:0 0 0 4px rgba(159,209,154,.18)}
.dot.off{background:var(--red);box-shadow:0 0 0 4px rgba(224,134,111,.18)}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
@media(max-width:900px){.cats{grid-template-columns:repeat(2,1fr);gap:12px}}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:190px;padding:20px;border-radius:var(--radius);text-decoration:none;
  background:linear-gradient(160deg,#203a22 0%,#18231a 55%,#151a16 100%);border:1px solid #2b3a2c;overflow:hidden}
.cat::before{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(216,183,120,.14),transparent 70%)}
.cat:hover{border-color:rgba(216,183,120,.5)}
.cat .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--gold);background:rgba(216,183,120,.08);border:1px solid rgba(216,183,120,.22)}
.cat .ic svg{width:28px;height:28px}
.cat .n{position:absolute;top:20px;right:20px;font-family:var(--head);font-size:15px;color:var(--muted2)}
.cat h3{font-family:var(--head);font-weight:400;font-size:clamp(20px,2.3vw,25px);line-height:1.15;margin-top:22px}
.cat .c{font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.cat .arrow{width:32px;height:32px;border-radius:50%;border:1px solid rgba(216,183,120,.45);display:grid;place-items:center;color:var(--gold)}
.cat:hover .arrow{background:var(--gold);color:#1b1a14}
.cat .arrow svg{width:14px;height:14px}

/* Featured */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
@media(max-width:860px){.feats{grid-template-columns:1fr}}
.feat{text-align:left;display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.feat:hover{border-color:rgba(216,183,120,.45);}
.feat .ic{flex-shrink:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--gold);background:rgba(216,183,120,.08)}
.feat .ic svg{width:22px;height:22px}
.feat h3{font-family:var(--head);font-weight:400;font-size:19px;line-height:1.2}
.feat .sub{font-size:12.5px;color:var(--muted)}
.feat .price{margin-left:auto}
.price{color:var(--gold);font-family:var(--head);font-size:20px;white-space:nowrap}
.price small{font-family:var(--body);font-size:11.5px;color:var(--muted);margin-right:4px}

/* Category view */
.catbar{position:sticky;top:68px;z-index:30;background:rgba(17,20,18,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.catbar .scroller{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:12px 16px;scrollbar-width:none;max-width:1120px;margin:auto}
.catbar .scroller::-webkit-scrollbar{display:none}
@media(min-width:1000px){.catbar .scroller{flex-wrap:wrap;justify-content:center}}
.pill{flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:#d4cdbc;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pill:hover{border-color:var(--gold);color:var(--cream)}
.pill[aria-current="page"]{background:var(--gold);border-color:var(--gold);color:#1b1a14;font-weight:700}
.pill svg{width:16px;height:16px}
.cat-head{padding:50px 0 18px;text-align:center}
.cat-head .big-ic{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;color:var(--gold);background:rgba(216,183,120,.08);border:1px solid rgba(216,183,120,.25)}
.cat-head .big-ic svg{width:34px;height:34px}
.cat-head p{color:var(--muted);max-width:540px;margin:10px auto 0}
.group-title{display:flex;align-items:center;gap:14px;margin:30px 0 4px;font-family:var(--head);font-size:24px;color:var(--gold)}
.group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.group-title svg{width:22px;height:22px}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
@media(max-width:860px){.list{grid-template-columns:1fr}}
.item{display:block;width:100%;text-align:left;padding:20px 10px;border-bottom:1px solid rgba(46,53,47,.75);border-radius:12px}
.item:hover{background:rgba(35,41,36,.55)}
.item .line{display:flex;align-items:baseline;gap:10px}
.item h3{font-family:var(--head);font-weight:400;font-size:21px;line-height:1.25}
.item .lead-dots{flex:1;border-bottom:1px dotted rgba(216,183,120,.35);transform:translateY(-5px);min-width:20px}
.item .price{font-size:21px}
.item .desc{color:var(--muted);font-size:14.5px;margin-top:6px}
.item .line{align-items:flex-start}
.item .lead-dots{margin-top:16px;transform:none}
.pr{display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:2px;align-items:baseline;justify-items:end;flex-shrink:0}
.pr .sl{font-size:12.5px;color:var(--muted)}
.pr .price{line-height:1.25}
.item .flags{display:flex;gap:6px;margin-top:6px}
.flag{font-family:var(--body);display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;line-height:1.5}
.flag.spicy{background:#3a1f19;color:#f19a85}
.flag.veg{background:#1d3220;color:var(--green-ink)}
@media(max-width:420px){.item{padding:16px 4px}.item h3,.item .price{font-size:19px}}
.ghost{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(216,183,120,.5);color:var(--gold);text-decoration:none;font-weight:500}
.ghost:hover{background:var(--gold);color:#1b1a14}
.ghost svg{width:16px;height:16px}

/* Info */
.info{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-top:34px}
@media(max-width:860px){.info{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card h3{font-family:var(--head);font-weight:400;font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h3 svg{width:20px;height:20px;color:var(--gold)}
.hours{list-style:none;font-size:15px}
.hours li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--muted)}
.hours li.today{color:var(--cream);font-weight:700}
.hours li:last-child{border:0}
.card p{color:var(--muted);font-size:15px}
.card .ghost{margin-top:16px;height:44px}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--muted2);font-size:13px;text-align:center}
footer .brand{justify-content:center;margin-bottom:10px}

/* Dialog */
dialog{border:0;padding:0;background:transparent;color:var(--cream);max-width:none;max-height:none;width:100%;height:100%;inset:0}
dialog::backdrop{background:rgba(5,7,6,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:30px 28px 26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.sheet .big-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--gold);background:rgba(216,183,120,.08);border:1px solid rgba(216,183,120,.22);margin-bottom:16px}
.sheet .big-ic svg{width:28px;height:28px}
.sheet h2{font-family:var(--head);font-weight:400;font-size:32px;line-height:1.1;margin-top:8px;padding-right:40px}
.sheet .desc{color:#cfc8b7;margin-top:12px}
.sheet .meta{margin-top:18px;display:grid;gap:12px;font-size:14px}
.sheet .meta dt{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:3px}
.sheet .meta dd{color:var(--muted)}
.sizes-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.sizes-pick button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:#d4cdbc}
.sizes-pick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(216,183,120,.1)}
.sheet .bottom{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sheet .bottom .price{font-size:32px}
.note{font-size:12px;color:var(--muted2)}
.x{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.x svg{width:18px;height:18px}
@media(max-width:620px){
  .sheet{top:auto;bottom:0;translate:-50% 0;width:100%;max-height:90%;border-radius:24px 24px 0 0;border-bottom:0;padding:26px 20px calc(24px + env(safe-area-inset-bottom))}
    .sheet h2{font-size:28px}
}

</style>
</head>

const ALL = [];
const slug = s => s.toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
CATS.forEach(c=>c.items.forEach(it=>{ it.cat=c; it.id=c.id+"-"+slug(it.n[0]); it.al=it.al||[]; it.fl=it.fl||[]; ALL.push(it); }));

/* ---------- Yardımcılar ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const tl = n => "₺" + n.toLocaleString(LI ? "en-GB" : "tr-TR");
const icon = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const orn = () => `<div class="orn">${icon("orn")}</div>`;
const flags = it => it.fl.length ? `<span class="flags">${it.fl.map(f=>`<span class="flag ${f}">${L(FLAGS[f])}</span>`).join("")}</span>` : "";
const fromPrice = it => it.s.length>1 ? `<small>${L(UI.from)}</small>${tl(Math.min(...it.s.map(x=>x[1])))}` : tl(it.s[0][1]);

const itemRow = it => `<button class="item" data-id="${it.id}" aria-haspopup="dialog">
  <div class="line"><h3>${esc(L(it.n))}${flags(it)}</h3><span class="lead-dots"></span>
    <span class="pr">${it.s.length===1?`<span></span><span class="price">${tl(it.s[0][1])}</span>`:it.s.map(x=>`<span class="sl">${esc(szLabel(x[0]))}</span><span class="price">${tl(x[1])}</span>`).join("")}</span></div>
  <p class="desc">${esc(L(it.d))}</p>
</button>`;

/* ---------- Saatler ---------- */
const DAYS = [["Pazartesi","Monday"],["Salı","Tuesday"],["Çarşamba","Wednesday"],["Perşembe","Thursday"],["Cuma","Friday"],["Cumartesi","Saturday"],["Pazar","Sunday"]];
const HOURS = [["10:00","00:00"],["10:00","00:00"],["10:00","00:00"],["10:00","01:00"],["10:00","02:00"],["09:00","02:00"],["09:00","00:00"]];
function openState(){
  const d=new Date(), idx=(d.getDay()+6)%7, m=d.getHours()*60+d.getMinutes();
  const toM=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
  const [o,c]=HOURS[idx]; let cl=toM(c); if(cl<=toM(o)) cl+=1440;
  const [po,pc]=HOURS[(idx+6)%7]; const late = toM(pc)<=toM(po) && m<toM(pc);
  const open = late || (m>=toM(o) && m<cl);
  return {idx,open,text: open ? `${L(UI.openNow)} · ${L(UI.until(late?pc:c))}` : `${L(UI.closedNow)} · ${L(UI.opens(o))}`};
}

    <h1 id="heroT">${L(UI.heroA)}<br><em>${L(UI.heroB)}</em></h1>
    <p>${L(UI.heroSub)}</p>
    <a class="cta" href="#kategoriler">${L(UI.cta)} ${icon("i-arrow")}</a>
    <div class="hero-meta">
      <span class="chip-info"><span class="dot ${st.open?"":"off"}"></span>${st.text}</span>
      <span class="chip-info">${ALL.length} ${L(UI.items)} · ${CATS.length} ${L(UI.cats)}</span>
    </div>
  </section>

  <section id="kategoriler" class="wrap" aria-labelledby="catT" style="padding-top:30px">
    ${orn()}<h2 class="h2" id="catT">${L(UI.catsT)}</h2><p class="lead">${L(UI.catsSub)}</p>
    <div class="cats">${CATS.map((c,i)=>`<a class="cat" href="#/k/${c.id}">
      <span class="ic">${icon(c.icon)}</span><span class="n">${String(i+1).padStart(2,"0")}</span>
      <div><h3>${L(c.name)}</h3><span class="c">${c.items.length} ${L(UI.product)} <span class="arrow">${icon("i-arrow")}</span></span></div>
    </a>`).join("")}</div>
  </section>

  <section class="wrap" aria-labelledby="favT" style="padding-top:20px">
    ${orn()}<h2 class="h2" id="favT">${L(UI.favT)}</h2><p class="lead">${L(UI.favSub)}</p>
    <div class="feats">${featured.map(it=>`<button class="feat" data-id="${it.id}" aria-haspopup="dialog">
      <span class="ic">${icon(it.cat.icon)}</span>
      <span><h3>${esc(L(it.n))}</h3><span class="sub">${L(it.cat.name)}</span></span>
      <span class="price">${fromPrice(it)}</span></button>`).join("")}</div>
  </section>

  <section class="wrap" aria-labelledby="infoT" style="padding-top:20px">
    ${orn()}<h2 class="h2" id="infoT">${L(UI.visit)}</h2>
    <div class="info">
      <div class="card"><h3>${icon("i-clock")}${L(UI.hours)}</h3>
        <ul class="hours">${HOURS.map((h,i)=>`<li class="${i===st.idx?"today":""}"><span>${L(DAYS[i])}</span><span>${h[0]} – ${h[1]}</span></li>`).join("")}</ul></div>
      <div class="card"><h3>${icon("i-pin")}${L(UI.loc)}</h3>
        <p>Figüran Cafe &amp; Pub<br>${L(UI.locTxt)}</p>
        <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Fig%C3%BCran%20Cafe%20Pub" target="_blank" rel="noopener">${L(UI.map)} ${icon("i-arrow")}</a></div>
      <div class="card"><h3>${icon("i-ig")}${L(UI.follow)}</h3>
        <p>${L(UI.followTxt)}</p>
        <a class="ghost" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram ${icon("i-arrow")}</a></div>
    </div>
  </section></div>`;
}

function viewCat(id){
  const c=CATS.find(x=>x.id===id); if(!c) return viewHome();
  const groups=[...new Set(c.items.map(x=>x.g||""))];
  return `<div class="view">
   <nav class="catbar" aria-label="${L(UI.catNav)}"><div class="scroller">
     <a class="pill" href="#/">${icon("i-back")}${L(UI.homeBtn)}</a>
     ${CATS.map(x=>`<a class="pill" href="#/k/${x.id}" ${x.id===c.id?'aria-current="page"':""}>${icon(x.icon)}${L(x.name)}</a>`).join("")}
   </div></nav>
   <header class="cat-head wrap"><div class="big-ic">${icon(c.icon)}</div>${orn()}<h1 class="h2">${L(c.name)}</h1><p>${L(c.intro)}</p></header>
   <section class="wrap" style="padding-top:0">
     ${groups.map(g=>`${g?`<h2 class="group-title">${icon(g==="tap"?"i-beer":"i-bottle")}${L(UI[g])}</h2>`:""}
       <div class="list">${c.items.filter(x=>(x.g||"")===g).map(itemRow).join("")}</div>`).join("")}
   </section></div>`;
}

  sheet.innerHTML=`<button class="x" id="xBtn" aria-label="${L(UI.close)}">${icon("i-x")}</button>

    ${it.fl.length?`<div style="margin-top:10px">${flags(it).replace('class="flags"','class="flags" style="margin-left:0"')}</div>`:""}

    <dl class="meta">
      ${it.i?`<div><dt>${L(UI.ing)}</dt><dd>${esc(L(it.i))}</dd></div>`:""}

    </dl>
    ${it.s.length>1?`<div class="sizes-pick" role="group" aria-label="${L(UI.sizePick)}">${it.s.map((x,i)=>`<button type="button" data-s="${i}" aria-pressed="${i===sel}">${esc(szLabel(x[0]))}</button>`).join("")}</div>`:""}
    <div class="bottom"><div><span class="note">${esc(szLabel(it.s[sel][0]))}</span><div class="price">${tl(it.s[sel][1])}</div></div>
    <span class="note" style="max-width:200px;text-align:right">${L(UI.orderNote)}</span></div>`;
  sheet.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel=+b.dataset.s;renderSheet();sheet.querySelector(`[data-s="${sel}"]`).focus();});
  $("#xBtn").onclick=()=>dlg.close();
}
function openItem(id){ openId=id; sel=0; renderSheet(); dlg.showModal(); }
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener("close",()=>{ openId=null; });

/* ---------- Yönlendirme (hash: GitHub Pages yenilemede sorunsuz) ---------- */
const main=$("#main");
function route(keepScroll){
  const h=location.hash||"#/";
  if(h==="#kategoriler"){ if(!$("#kategoriler")) { main.innerHTML=viewHome(); bind(); } $("#kategoriler").scrollIntoView(); return; }
  const k=h.match(/^#\/k\/([\w-]+)/);
  main.innerHTML = k ? viewCat(k[1]) : viewHome();
  if(!keepScroll) window.scrollTo({top:0,behavior:"instant"});
  bind();
  const cur=$(".pill[aria-current]"); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
  const c=k && CATS.find(x=>x.id===k[1]);
  document.title=(c?L(c.name)+" · ":"")+"Figüran Cafe & Pub · "+L(UI.title);
}
function bind(){
  main.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openItem(b.dataset.id));
}
addEventListener("hashchange",()=>route(false));

/* ---------- Dil değişimi ---------- */
function applyLang(){
  document.documentElement.lang = LI ? "en" : "tr";
  $("#skip").textContent=L(UI.skip);
  $("#homeLink").setAttribute("aria-label",L(UI.home));
  $("#langGroup").setAttribute("aria-label",L(UI.langLabel));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String((b.dataset.lang==="en")===!!LI)));
  $("#foot1").textContent=L(UI.foot1); $("#foot2").textContent=L(UI.foot2);
  document.querySelector('meta[name="description"]').content = LI ? "Figüran Cafe & Pub digital menu." : "Figüran Cafe & Pub dijital menüsü.";
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
  const n = b.dataset.lang==="en" ? 1 : 0; if(n===LI) return;
  LI=n; try{ localStorage.setItem("figuran-lang", LI?"en":"tr"); }catch(e){}
  const y=scrollY; applyLang(); route(true); window.scrollTo({top:y,behavior:"instant"});
  if(dlg.open) renderSheet();
});

const hdr=$("#top");
addEventListener("scroll",()=>hdr.classList.toggle("scrolled",scrollY>8),{passive:true});
$("#yr").textContent=new Date().getFullYear();
applyLang(); route(false);
</script>
</body>
